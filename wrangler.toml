name = "my-cloudflare-app"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# KV Namespaces (key-value store)
# Create with: wrangler kv:namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_NAMESPACE_ID"

# R2 Buckets (object/file storage)
# Create with: wrangler r2 bucket create my-app-storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "my-app-storage"
preview_bucket_name = "my-app-storage-preview"

# D1 Databases (SQLite)
# Create with: wrangler d1 create my-app-db
[[d1_databases]]
binding = "DB"
database_name = "my-app-db"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
APP_ENV = "production"
